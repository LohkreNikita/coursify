<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Coursify - Contact</title>
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
	</head>
	<body>
		<header class="header-container">
			<div class="logo"><a href="index.html">Coursify</a></div>
			<input type="checkbox" id="nav-toggle" class="nav-toggle" />
			<label for="nav-toggle" class="nav-toggle-label">
				<i class="fa-solid fa-bars fa-xl" style="color: #f9faf8"></i>
			</label>
			<nav class="nav-container" aria-label="Main navigation">
				<a href="courses.html">Courses</a>
				<a href="about.html">About</a>
				<a href="contact.html">Contact</a>
				<a href="signup.html">Sign Up</a>
			</nav>
		</header>
		<main>
			<section class="hero-section" style="height: 200px">
				<div class="hero-txt" style="text-align: center; padding: 20px">
					<h1>Contact Us</h1>
					<p>Have questions or feedback? We'd love to hear from you!</p>
				</div>
			</section>
			<form>
				<fieldset
					class="profile-details"
					style="
						width: 50%;
						margin: 0 auto;
						padding: 20px;
						border: 1px solid #ccc;
						border-radius: 5px;
					"
				>
					<legend>Send us a message</legend>
					<p>
						<label for="name">Your Name:</label>
						<input type="text" id="name" name="name" required />
					</p>
					<p>
						<label for="email">Your Email:</label>
						<input type="email" id="email" name="email" required />
					</p>
					<p>
						<label for="message">Your Message:</label>
						<textarea
							id="message"
							name="message"
							rows="5"
							required
							style="
								width: 100%;
								padding: 10px;
								border: 1px solid #ccc;
								border-radius: 5px;
							"
						></textarea>
					</p>
					<button class="signup-btn" type="submit">Send Message</button>
				</fieldset>
			</form>
		</main>
		<footer>
			<p>Copyright &copy;</p>
		</footer>
	</body>
</html>

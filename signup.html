<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coursify - Sign Up</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
        <logo>Coursify</logo>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="signup.html">Sign Up</a>
        </nav>
	</header>
    <main>
        <section class="hero">
        <hero>
            <h1>Sign Up for Coursify.</h1>
            <p>We just need a few details to get you started.</p>
        </hero>
        </section>
        <form action="submit_signup.php" method="POST">
            <section class="even">
                <fieldset class="profile-details">
                    <legend>Your Details</legend>
                    <h2>The details for your profile.</h2>
                    <div class="name-fields">
                        <p>
                            <label for="firstName">First Name:</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </p>
                        <p>
                            <label for="lastName">Last Name:</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </p>
                    </div>
                    <p>
                        <label for="Username">Username:</label>
                        <input type="text" id="Username" name="Username" required>
                    </p>
                    <p>
                        <label for="Password">Password:</label>
                        <input type="password" id="Password" name="Password" required>
                    </p>
                    <p>
                        <label for="email">Your Email:</label>
                        <input type="email" id="email" name="email" required>
                    </p>
                </fieldset>
            </section>
            <section class="odd">
                <fieldset>
                    <legend>Course Selection</legend>
                    <h2>Which courses are you interested in?</h2>
                    <div class="course-options">
                        <label class="course-card">
                            <input type="checkbox" id="course1" name="courses" value="course1">
                            <span class="course-card-content">
                                <strong>Responsive Web Development</strong>
                                <span>Build accessible websites that adapt smoothly to phones, tablets, and desktops.</span>
                            </span>
                        </label>
                        <label class="course-card">
                            <input type="checkbox" id="course2" name="courses" value="course2">
                            <span class="course-card-content">
                                <strong>Mobile App Development</strong>
                                <span>Learn the core patterns for planning, coding, and testing mobile applications.</span>
                            </span>
                        </label>
                        <label class="course-card">
                            <input type="checkbox" id="course3" name="courses" value="course3">
                            <span class="course-card-content">
                                <strong>Python Programming Foundations</strong>
                                <span>Practice variables, functions, data structures, and problem-solving with Python.</span>
                            </span>
                        </label>
                        <label class="course-card">
                            <input type="checkbox" id="course4" name="courses" value="course4">
                            <span class="course-card-content">
                                <strong>JavaScript for Interactive Web</strong>
                                <span>Make web pages respond to users with events, DOM updates, and modern JavaScript.</span>
                            </span>
                        </label>
                        <label class="course-card">
                            <input type="checkbox" id="course5" name="courses" value="course5">
                            <span class="course-card-content">
                                <strong>HTML and CSS Essentials</strong>
                                <span>Create well-structured pages and polished layouts using semantic HTML and CSS.</span>
                            </span>
                        </label>
                        <label class="course-card">
                            <input type="checkbox" id="course6" name="courses" value="course6">
                            <span class="course-card-content">
                                <strong>SQL and Database Design</strong>
                                <span>Query, organize, and connect relational data while learning practical database design.</span>
                            </span>
                        </label>
                    </div>
                </fieldset>
            </section>
            <section class="even">
                <fieldset class="action">
                    <article>
                        <h1>Just to finish up.</h1>
                        <p>
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">I agree to the <a href="terms.html">Terms and Conditions</a>.</label>
                        </p>
                        <p>
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <label for="newsletter">I want to receive the newsletter and be kept up to date with all the latest courses available.</label>
                        </p>
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </article>
                </fieldset>

            </section>
        </form>
    </main>
	<footer>
		<p>Copyright &copy;</p>
	</footer>
</body>
</html>
